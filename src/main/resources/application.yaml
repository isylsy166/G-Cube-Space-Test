# MySQL 프로파일 — docker-compose.yml 의 mysql 서비스에 접속한다.
#   실행: ./gradlew bootRun --args='--spring.profiles.active=mysql'
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/gcube?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: gcube
    password: gcube
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 동시성 테스트에서 커넥션 고갈로 데드락처럼 보이는 현상을 피하려면
      # 풀 크기가 테스트 스레드 수보다 커야 한다.
      maximum-pool-size: 20
      connection-timeout: 3000

  jpa:
    # DDL 은 schema-mysql.sql 이 만든다. 엔티티와 실제 스키마가 어긋나면 기동 실패시켜
    # "엔티티만 고치고 DDL 을 안 고친" 상태를 배포 전에 잡는다.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
    open-in-view: false

  # 스키마는 컨테이너 initdb 가 이미 적용했으므로 앱은 DDL 을 실행하지 않는다.
  sql:
    init:
      mode: never

# 업무 기준시각. 과제 데이터가 이 시각을 기준으로 만들어져 있다.
# 비우면 실제 시계를 쓴다.
app:
  base-time: 2026-07-21T09:00:00

logging:
  level:
    org.hibernate.SQL: debug
