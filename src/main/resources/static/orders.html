<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문 — 재고 흐름 ERP</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
    <h1>재고 흐름 ERP</h1>
    <nav>
        <a href="/items">제품</a>
        <a href="/orders" class="on">주문</a>
        <a href="/schedules">발주</a>
    </nav>
    <span class="clock">기준시각 2026-07-21 09:00</span>
</header>

<main>
    <div class="panel">
        <h2>주문<span class="count" id="orderCount"></span></h2>
        <div class="filters">
            <select id="delivery"><option value="">배송일 전체</option></select>
            <select id="warehouse"><option value="">창고 전체</option></select>
            <select id="readiness">
                <option value="">준비상태 전체</option>
                <option value="READY">바로 준비 가능</option>
                <option value="WAIT_INSPECTION">품질검사 대기</option>
                <option value="WAIT_PRODUCTION">생산 완료 대기</option>
                <option value="WAIT_PURCHASE">구매 입고 대기</option>
                <option value="SHORTAGE">재고 부족</option>
                <option value="REVIEW_REQUIRED">확인 필요</option>
            </select>
            <select id="status">
                <option value="">주문상태 전체</option>
                <option value="CONFIRMED">주문 확정</option>
                <option value="CANCELED">취소</option>
                <option value="SHIPPED">출고 완료</option>
                <option value="DELIVERED">배송 완료</option>
            </select>
        </div>
        <div class="scroll" id="orderList"></div>
    </div>

    <div class="panel" id="detail">
        <h2>주문 상세</h2>
        <p class="empty">왼쪽에서 주문을 선택하세요.</p>
    </div>
</main>

<script src="/js/app.js"></script>
<script src="/js/orders.js"></script>
</body>
</html>
