<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문 — 재고 흐름 ERP</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
    <div class="brand">재고 흐름 <span>ERP</span></div>
    <nav class="tabs">
        <a href="/items">제품</a>
        <a href="/orders" aria-current="page">주문</a>
        <a href="/schedules">발주</a>
    </nav>
    <div class="asof">기준시각 <b>2026-07-21 09:00</b></div>
</header>

<div class="wrap">
    <div class="page-head">
        <h1>주문</h1>
        <p>배송예정일이 빠른 주문부터 재고를 배분해 준비 가능 여부를 판정합니다. 막힌 주문이 위쪽에 드러납니다.</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card">
        <div class="toolbar">
            <select id="delivery"><option value="">배송일 전체</option></select>
            <select id="warehouse"><option value="">창고 전체</option></select>
            <select id="orderStatus">
                <option value="">주문상태 전체</option>
                <option value="CONFIRMED">주문 확정</option>
                <option value="CANCELED">취소</option>
                <option value="SHIPPED">출고 완료</option>
                <option value="DELIVERED">배송 완료</option>
            </select>
            <span class="grow" id="count"></span>
        </div>
        <div class="scroller" id="list"></div>
    </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/orders.js"></script>
</body>
</html>
