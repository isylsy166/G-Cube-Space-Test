<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>제품 — 재고 흐름 ERP</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
    <h1>재고 흐름 ERP</h1>
    <nav>
        <a href="/items" class="on">제품</a>
        <a href="/orders">주문</a>
        <a href="/schedules">발주</a>
    </nav>
    <span class="clock">기준시각 2026-07-21 09:00</span>
</header>

<main>
    <div class="panel">
        <h2>품목<span class="count" id="itemCount"></span></h2>
        <div class="filters">
            <input id="keyword" type="search" placeholder="품목코드 · 품목명">
            <select id="category"><option value="">분류 전체</option></select>
            <select id="type"><option value="">유형 전체</option></select>
            <label><input id="serialOnly" type="checkbox"> 시리얼 관리만</label>
        </div>
        <div class="scroll" id="itemList"></div>
    </div>

    <div class="panel" id="detail">
        <h2>품목 상세</h2>
        <p class="empty">왼쪽에서 품목을 선택하세요.</p>
    </div>
</main>

<script src="/js/app.js"></script>
<script src="/js/items.js"></script>
</body>
</html>
