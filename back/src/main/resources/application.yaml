spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/gcube?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: gcube
    password: gcube
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 동시성 테스트에서 커넥션 고갈로 데드락처럼 보이는 현상을 피하려면 풀 크기가 테스트 스레드 수보다 커야 함
      maximum-pool-size: 20
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
    open-in-view: false

  sql:
    init:
      mode: never

# 업무 기준시각.
app:
  base-time: 2026-07-21T09:00:00

logging:
  level:
    org.hibernate.SQL: debug
