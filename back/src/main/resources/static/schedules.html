<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>발주 — 재고 흐름 ERP</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
    <div class="brand">재고 흐름 <span>ERP</span></div>
    <nav class="tabs">
        <a href="/items">제품</a>
        <a href="/orders">주문</a>
        <a href="/schedules" aria-current="page">발주</a>
    </nav>
    <div class="asof">기준시각 <b>2026-07-21 09:00</b></div>
</header>

<div class="wrap">
    <div class="page-head">
        <h1>발주 · 생산의뢰</h1>
        <p>기준시각에 이미 있던 문서와 앱에서 만든 문서를 한 목록에서 관리합니다. 입고해야 현재고가 늘어납니다.</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card">
        <div class="toolbar">
            <select id="type">
                <option value="">구분 전체</option>
                <option value="PURCHASE">구매발주</option>
                <option value="PRODUCTION">생산의뢰</option>
            </select>
            <select id="warehouse"><option value="">창고 전체</option></select>
            <input id="itemCode" type="search" placeholder="품목코드">
            <span class="grow" id="count"></span>
        </div>
        <div class="scroller" id="list"></div>
    </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/schedules.js"></script>
</body>
</html>
