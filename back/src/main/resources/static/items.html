<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>제품 — 재고 흐름 ERP</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
    <div class="brand">재고 흐름 <span>ERP</span></div>
    <nav class="tabs">
        <a href="/items" aria-current="page">제품</a>
        <a href="/orders">주문</a>
        <a href="/schedules">발주</a>
    </nav>
    <div class="asof">기준시각 <b>2026-07-21 09:00</b></div>
</header>

<div class="wrap">
    <div class="page-head">
        <h1>제품</h1>
        <p>품목별 재고와 시리얼 개체, 기다리는 주문과 걸려 있는 입고예정을 함께 봅니다.</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card">
        <div class="toolbar">
            <input id="q" type="search" placeholder="품목코드 · 품목명 검색">
            <select id="category"><option value="">분류 전체</option></select>
            <select id="type"><option value="">유형 전체</option></select>
            <span class="grow" id="count"></span>
        </div>
        <div class="scroller" id="list"></div>
    </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/items.js"></script>
</body>
</html>
